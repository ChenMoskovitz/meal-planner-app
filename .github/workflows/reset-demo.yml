name: Reset demo account

# The demo account's credentials are public (in the README), so anything it
# owns is writable by anyone looking at the project. Running the seed daily
# wipes whatever a visitor changed and rebuilds a clean week — and since the
# week is computed from today's date, this is also what rolls the plan over
# to the new week once Sunday comes around.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      DEMO_EMAIL: demo@mealplanner.app
      DEMO_PASSWORD: MealPlannerDemo2026!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: node scripts/seed-demo.mjs
